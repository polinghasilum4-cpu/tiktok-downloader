<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== BACKGROUND VIDEO ===== */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        .bg-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .bg-video::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.55);
        }

        /* Unmute Button */
        .unmute-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.6);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .unmute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 35px;
            max-width: 560px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: containerIn 0.6s ease;
        }
        @keyframes containerIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .icon {
            font-size: 42px;
            display: block;
            margin-bottom: 4px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .header h1 span {
            background: linear-gradient(135deg, #ff0050, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        /* ===== INPUT ===== */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #ff0050;
            background: rgba(255, 255, 255, 0.08);
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* ===== BUTTONS ===== */
        .btn-download {
            padding: 14px 24px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff0050, #ff6b6b);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 0, 80, 0.35);
        }
        .btn-download:active { transform: scale(0.97); }
        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-music {
            background: linear-gradient(135deg, #06b6d4, #3b82f6) !important;
        }
        .btn-music:hover {
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.35) !important;
        }

        /* ===== BUTTON GROUP (2 Tombol) ===== */
        .btn-group-top {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-group-top .btn-download {
            flex: 1;
        }

        /* ===== LOADING ===== */
        .loading {
            display: none;
            text-align: center;
            padding: 18px 0;
            color: rgba(255, 255, 255, 0.5);
        }
        .loading.show { display: block; }
        .spinner-ring {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.06);
            border-top: 3px solid #ff0050;
            border-right: 3px solid #ff6b6b;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== ERROR ===== */
        .error-msg {
            color: #f87171;
            font-size: 14px;
            padding: 10px 14px;
            background: rgba(239, 68, 68, 0.08);
            border-radius: 12px;
            border-left: 3px solid #ef4444;
            display: none;
            margin-top: 10px;
        }
        .error-msg.show { display: block; }

        /* ===== RESULT ===== */
        .result-container {
            margin-top: 18px;
            border-radius: 16px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
            animation: resultIn 0.4s ease;
        }
        .result-container.show { display: block; }
        @keyframes resultIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-container .preview {
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.4);
            max-height: 360px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .result-container .preview img,
        .result-container .preview video {
            max-width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: 12px;
        }
        .result-container .title {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .result-container .info {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-bottom: 10px;
        }
        .result-container .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .result-container .stats span {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 10px;
            border-radius: 20px;
        }
        .result-container .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .result-container .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff0050, #ff6b6b);
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .result-container .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 80, 0.3);
        }
        .btn-save-music {
            background: linear-gradient(135deg, #06b6d4, #3b82f6) !important;
        }
        .btn-save-music:hover {
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.3) !important;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 11px;
        }
        .footer span {
            color: rgba(255, 255, 255, 0.25);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .container { padding: 20px; }
            .input-group { flex-direction: column; }
            .btn-download { width: 100%; justify-content: center; }
            .btn-group-top { flex-direction: column; }
            .btn-group { flex-direction: column; }
            .btn-save { width: 100%; justify-content: center; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND VIDEO ===== -->
    <div class="bg-video">
        <video autoplay muted loop playsinline id="bgVideo">
            <source src="https://files.catbox.moe/xwvcs6.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Unmute Button -->
    <button class="unmute-btn" onclick="toggleMute()">🔇 Unmute</button>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">

        <div class="header">
            <span class="icon">🎵</span>
            <h1><span>TikTok</span> Downloader</h1>
            <p>Download video &amp; audio tanpa watermark</p>
        </div>

        <!-- ===== INPUT ===== -->
        <div class="input-group">
            <input type="text" id="ttUrl" placeholder="🔗 Masukkan URL TikTok..." />
        </div>

        <!-- ===== BUTTON GROUP (2 Tombol) ===== -->
        <div class="btn-group-top">
            <button class="btn-download btn-music" id="ttMusicBtn">🎵 Download Audio</button>
            <button class="btn-download" id="ttDownloadBtn">⬇ Download Video</button>
        </div>

        <!-- ===== LOADING ===== -->
        <div class="loading" id="ttLoading">
            <div class="spinner-ring"></div>
            <div style="font-size:13px;">Memproses<span>.</span><span>.</span><span>.</span></div>
        </div>

        <!-- ===== ERROR ===== -->
        <div class="error-msg" id="ttError"></div>

        <!-- ===== RESULT ===== -->
        <div class="result-container" id="ttResult">
            <div class="preview" id="ttPreview"></div>
            <div class="title" id="ttTitle"></div>
            <div class="info" id="ttInfo"></div>
            <div class="stats" id="ttStats"></div>
            <div class="btn-group">
                <a href="#" class="btn-save btn-save-music" id="ttMusicSaveBtn" download>🎵 Download Audio</a>
                <a href="#" class="btn-save" id="ttSaveBtn" download>💾 Download Video</a>
            </div>
        </div>

        <div class="footer">
            © 2026 • <span>TikTok Downloader</span> • by xs0ciety
        </div>
    </div>

    <script>
        // ===== UNMUTE =====
        function toggleMute() {
            const video = document.getElementById('bgVideo');
            const btn = document.querySelector('.unmute-btn');
            if (video.muted) {
                video.muted = false;
                btn.textContent = '🔊 Mute';
            } else {
                video.muted = true;
                btn.textContent = '🔇 Unmute';
            }
        }

        // ===== MAIN FUNCTIONS =====
        function formatNumber(num) {
            let n = parseInt(num);
            return Number(n).toLocaleString().replace(/,/g, ".");
        }

        function formatDate(n) {
            let d = new Date(n * 1000);
            return d.toLocaleDateString('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        async function tiktokDl(url) {
            const domain = 'https://www.tikwm.com/api/';
            const res = (
                await axios.post(
                    domain, {},
                    {
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                            'Origin': 'https://www.tikwm.com',
                            'Referer': 'https://www.tikwm.com/',
                            'User-Agent': 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        params: { url, count: 12, cursor: 0, web: 1, hd: 1 }
                    }
                )
            ).data.data;

            let data = [];

            if (res?.duration == 0) {
                res.images.forEach((v) => data.push({ type: 'photo', url: v }));
            } else {
                data.push(
                    { type: 'watermark', url: 'https://www.tikwm.com' + (res?.wmplay || '') },
                    { type: 'nowatermark', url: 'https://www.tikwm.com' + (res?.play || '') },
                    { type: 'nowatermark_hd', url: 'https://www.tikwm.com' + (res?.hdplay || '') }
                );
            }

            return {
                title: res.title || 'Tidak ada judul',
                taken_at: formatDate(res.create_time),
                region: res.region || 'Global',
                duration: res.duration + ' Seconds',
                data: data,
                music_info: {
                    title: res.music_info?.title || 'Unknown',
                    author: res.music_info?.author || 'Unknown',
                    url: 'https://www.tikwm.com' + (res.music || res.music_info?.play || '')
                },
                stats: {
                    views: formatNumber(res.play_count || 0),
                    likes: formatNumber(res.digg_count || 0),
                    comment: formatNumber(res.comment_count || 0),
                    share: formatNumber(res.share_count || 0),
                    download: formatNumber(res.download_count || 0)
                },
                author: {
                    nickname: res.author?.nickname || 'Unknown',
                    fullname: res.author?.unique_id || 'unknown'
                }
            };
        }

        // ===== UI =====
        const urlInput = document.getElementById('ttUrl');
        const downloadBtn = document.getElementById('ttDownloadBtn');
        const musicBtn = document.getElementById('ttMusicBtn');
        const loading = document.getElementById('ttLoading');
        const errorEl = document.getElementById('ttError');
        const resultEl = document.getElementById('ttResult');
        const preview = document.getElementById('ttPreview');
        const titleEl = document.getElementById('ttTitle');
        const infoEl = document.getElementById('ttInfo');
        const statsEl = document.getElementById('ttStats');
        const saveBtn = document.getElementById('ttSaveBtn');
        const musicSaveBtn = document.getElementById('ttMusicSaveBtn');

        function showLoading() { loading.classList.add('show');
            downloadBtn.disabled = true;
            musicBtn.disabled = true; }

        function hideLoading() { loading.classList.remove('show');
            downloadBtn.disabled = false;
            musicBtn.disabled = false; }

        function showError(msg) {
            errorEl.textContent = '❌ ' + msg;
            errorEl.classList.add('show');
            setTimeout(() => errorEl.classList.remove('show'), 6000);
        }

        function hideError() { errorEl.classList.remove('show'); }

        function showResult() { resultEl.classList.add('show'); }

        function hideResult() { resultEl.classList.remove('show'); }

        async function processTikTok(url) {
            hideError();
            hideResult();
            showLoading();

            try {
                const result = await tiktokDl(url);
                const isVideo = result.duration !== '0 Seconds';
                let mediaUrl = '';

                if (isVideo) {
                    const videoItem = result.data.find(e => e.type === 'nowatermark_hd' || e.type === 'nowatermark') ||
                    result.data[0];
                    mediaUrl = videoItem?.url || '';
                    preview.innerHTML =
                        `<video controls src="${mediaUrl}" style="max-height:360px;width:100%;border-radius:12px;"></video>`;
                } else {
                    const photo = result.data.find(e => e.type === 'photo');
                    mediaUrl = photo?.url || '';
                    preview.innerHTML =
                        `<img src="${mediaUrl}" alt="Thumbnail" style="max-height:360px;width:100%;border-radius:12px;">`;
                    if (result.data.length > 1) {
                        let slideHtml = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">';
                        result.data.forEach((p) => {
                            slideHtml +=
                                `<img src="${p.url}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;" onclick="window.open('${p.url}','_blank')">`;
                        });
                        slideHtml += '</div>';
                        preview.innerHTML += slideHtml;
                    }
                }

                titleEl.textContent = result.title;
                infoEl.textContent = `👤 ${result.author.nickname} (@${result.author.fullname}) • 📅 ${result.taken_at} • 🌍 ${result.region}`;

                statsEl.innerHTML = `
                    <span>👁️ ${result.stats.views}</span>
                    <span>❤️ ${result.stats.likes}</span>
                    <span>💬 ${result.stats.comment}</span>
                    <span>↗️ ${result.stats.share}</span>
                    <span>⬇️ ${result.stats.download}</span>
                `;

                const ext = isVideo ? 'mp4' : 'jpg';
                saveBtn.href = mediaUrl;
                saveBtn.download = `${result.title || 'tiktok'}.${ext}`;

                if (result.music_info.url) {
                    musicSaveBtn.href = result.music_info.url;
                    musicSaveBtn.download = `${result.music_info.title || 'music'}.mp3`;
                    musicSaveBtn.style.display = 'inline-flex';
                } else {
                    musicSaveBtn.style.display = 'none';
                }

                showResult();
            } catch (err) {
                showError(err.message || 'Gagal mengunduh');
            } finally {
                hideLoading();
            }
        }

        downloadBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url || !url.includes('tiktok.com') && !url.includes('vt.tiktok.com')) {
                showError('Masukkan URL TikTok yang valid!');
                return;
            }
            processTikTok(url);
        });

        musicBtn.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (!url || !url.includes('tiktok.com') && !url.includes('vt.tiktok.com')) {
                showError('Masukkan URL TikTok yang valid!');
                return;
            }
            processTikTok(url);
        });

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') downloadBtn.click();
        });

        console.log('✅ TikTok Downloader siap!');
    </script>

    <!-- Load Axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js">
    </script>

</body>
</html>
